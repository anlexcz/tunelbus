name: Tunelbus preview quality tests

on:
  push:
    branches:
      - design/tunelbus-light-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  methodology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Quality regression tests
        run: pytest -q tests/test_public_quality_regressions.py
